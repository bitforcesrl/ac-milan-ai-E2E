# templates/e2e-job.yml
# Template della job E2E. La lista dei test e' passata come parametro object:
# ogni voce ha { id, enabled } dove id corrisponde a un test in config.js.
# I flag env TEST_<ID in SNAKE_CASE> sono generati automaticamente dal loop,
# quindi aggiungere un test richiede solo una nuova voce in parameters.tests.

parameters:
  - name: tests
    type: object
    default: []
  - name: runChromium
    type: boolean
    default: true
  - name: runFirefox
    type: boolean
    default: false
  - name: runWebkit
    type: boolean
    default: false
  - name: runDesktop
    type: boolean
    default: true
  - name: runTablet
    type: boolean
    default: false
  - name: runMobile
    type: boolean
    default: false
  - name: openrouterAiModel
    type: string
    default: qwen/qwen3.7-plus
  - name: maxParallelSessions
    type: string
    default: '3'

jobs:
  - job: e2e
    displayName: AI E2E tests
    timeoutInMinutes: 20
    steps:
      - checkout: self

      - task: NodeTool@0
        displayName: Use Node 22
        inputs:
          versionSpec: '22.x'

      - script: |
          npm install
          npx playwright install --with-deps chromium firefox webkit
        displayName: Install dependencies and browsers

      # Ogni test di config.js ha un flag env TEST_<ID in SNAKE_CASE>
      # (es. 'pdp-fuzzy' -> TEST_PDP_FUZZY), generato qui dal parametro object.
      # run-e2e-ci.mjs legge questi flag e valida che corrispondano a id reali.
      - script: node scripts/run-e2e-ci.mjs
        displayName: Run AI E2E
        env:
          OPENROUTER_API_KEY: $(OPENROUTER_API_KEY)
          OPENROUTER_AI_MODEL: ${{ parameters.openrouterAiModel }}
          RUN_CHROMIUM: ${{ parameters.runChromium }}
          RUN_FIREFOX: ${{ parameters.runFirefox }}
          RUN_WEBKIT: ${{ parameters.runWebkit }}
          RUN_DESKTOP: ${{ parameters.runDesktop }}
          RUN_TABLET: ${{ parameters.runTablet }}
          RUN_MOBILE: ${{ parameters.runMobile }}
          MAX_PARALLEL_SESSIONS: ${{ parameters.maxParallelSessions }}
          ${{ each test in parameters.tests }}:
          TEST_${{ upper(replace(test.id, '-', '_')) }}: ${{ test.enabled }}
          ${{ end }}

      # 1. Sync storico raw: scarica le run precedenti da blob, merge con la run corrente e ricarica
      - script: node scripts/sync-history.mjs
        displayName: Sync raw reports history to blob storage
        env:
          AZURE_STORAGE_CONNECTION_STRING: $(AZURE_STORAGE_CONNECTION_STRING)
          AZURE_STORAGE_CONTAINER: $(AZURE_STORAGE_CONTAINER)
          REPORT_BLOB_PREFIX: e2e

      # I report JSON strutturati (meta/<testId>.json) sono già caricati su blob da sync-history.mjs
      # e sono visualizzati dalla dashboard Next.js (/reports).

      - task: PublishPipelineArtifact@1
        displayName: Publish reports artifact
        inputs:
          targetPath: reports
          artifact: e2e-reports

