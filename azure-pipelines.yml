parameters:
  - name: runChromium
    displayName: Browser Chromium
    type: boolean
    default: true
  - name: runFirefox
    displayName: Browser Firefox
    type: boolean
    default: false
  - name: runWebkit
    displayName: Browser WebKit (Safari)
    type: boolean
    default: false
  - name: runDesktop
    displayName: Viewport desktop (1280x650)
    type: boolean
    default: true
  - name: runTablet
    displayName: Viewport tablet (768x1024)
    type: boolean
    default: false
  - name: runMobile
    displayName: Viewport mobile (390x844)
    type: boolean
    default: false
  - name: openrouterAiModel
    displayName: AI Model (OpenRouter)
    type: string
    default: qwen/qwen3.7-plus
    values:
      - qwen/qwen3.7-plus
  - name: maxParallelSessions
    displayName: Sessioni in parallelo (browser x viewport)
    type: string
    default: '3'
    values:
      - '1'
      - '2'
      - '3'
  # ---- Test E2E disponibili (id definiti in config.js) ----
  # Per aggiungere un test: aggiungerlo a config.js e qui una voce { id, enabled }.
  # I flag env TEST_<ID in SNAKE_CASE> sono generati automaticamente dal template.
  - name: tests
    displayName: Test E2E da eseguire (JSON: [{ id, enabled }])
    type: object
    default:
      - id: fail-test
        enabled: false
      - id: pdp
        enabled: false
      - id: pdp-fuzzy
        enabled: false
      - id: quickbuy-combinations
        enabled: false
      - id: quickbuy-personalization
        enabled: false
      - id: quickbuy-cart-validation
        enabled: true

trigger:
  branches:
    include:
      - main
      - pipeline-test 

pr: none

schedules:
  - cron: '0 6 * * *'
    displayName: Daily E2E 06:00 UTC
    branches:
      include:
        - main
    always: true

pool:
  name: 'Internal Linux with Docker' 
  demands:
    - jdk -equals 21

variables:
  - group: acmilan-e2e-secrets

jobs:
  - template: templates/e2e-job.yml
    parameters:
      tests: ${{ parameters.tests }}
      runChromium: ${{ parameters.runChromium }}
      runFirefox: ${{ parameters.runFirefox }}
      runWebkit: ${{ parameters.runWebkit }}
      runDesktop: ${{ parameters.runDesktop }}
      runTablet: ${{ parameters.runTablet }}
      runMobile: ${{ parameters.runMobile }}
      openrouterAiModel: ${{ parameters.openrouterAiModel }}
      maxParallelSessions: ${{ parameters.maxParallelSessions }}
