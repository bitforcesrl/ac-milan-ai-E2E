parameters:
  - name: runChromium
    displayName: Browser Chromium
    type: boolean
    default: true
  - name: runFirefox
    displayName: Browser Firefox
    type: boolean
    default: false
  - name: runWebkit
    displayName: Browser WebKit (Safari)
    type: boolean
    default: false
  - name: runDesktop
    displayName: Viewport desktop (1280x650)
    type: boolean
    default: true
  - name: runTablet
    displayName: Viewport tablet (768x1024)
    type: boolean
    default: false
  - name: runMobile
    displayName: Viewport mobile (390x844)
    type: boolean
    default: false
  - name: openrouterAiModel
    displayName: AI Model (OpenRouter)
    type: string
    default: qwen/qwen3.7-plus
    values:
      - qwen/qwen3.7-plus
  - name: maxParallelSessions
    displayName: Sessioni in parallelo (browser x viewport)
    type: string
    default: '1'
    values:
      - '1'
      - '2'
      - '3'
      - '4'
      - '6'
  # ---- Test E2E disponibili (definiti in config.js) ----
  - name: failTest
    displayName: Test fail-test (fail.test.md)
    type: boolean
    default: false
  - name: pdp
    displayName: Test pdp (pdp/pdp.test.md)
    type: boolean
    default: false
  - name: pdpFuzzy
    displayName: Test pdp-fuzzy (pdp/pdp-fuzzy.test.md)
    type: boolean
    default: false
  - name: quickbuyCombinations
    displayName: Test quickbuy-combinations (quickbuy/quickbuy-combinations.test.md)
    type: boolean
    default: false
  - name: quickbuyPersonalization
    displayName: Test quickbuy-personalization (quickbuy/quickbuy-personalization.test.md)
    type: boolean
    default: false
  - name: quickbuyCartValidation
    displayName: Test quickbuy-cart-validation (quickbuy/quickbuy-cart-validation.test.md)
    type: boolean
    default: true

trigger:
  branches:
    include:
      - main
      - pipeline-test 

pr: none

schedules:
  - cron: '0 6 * * *'
    displayName: Daily E2E 06:00 UTC
    branches:
      include:
        - main
    always: true

pool:
  name: 'Internal Linux with Docker' 
  demands:
    - jdk -equals 21

variables:
  - group: acmilan-e2e-secrets

jobs:
  - job: e2e
    displayName: AI E2E tests
    timeoutInMinutes: 20
    steps:
      - checkout: self

      - task: NodeTool@0
        displayName: Use Node 22
        inputs:
          versionSpec: '22.x'

      - script: |
          npm install
          npx playwright install --with-deps chromium firefox webkit
        displayName: Install dependencies and browsers

      - script: |
          TESTS_ENABLED=""
          if [ "${{ parameters.failTest }}" = "True" ]; then
            TESTS_ENABLED="${TESTS_ENABLED:+$TESTS_ENABLED,}fail-test"
          fi
          if [ "${{ parameters.pdp }}" = "True" ]; then
            TESTS_ENABLED="${TESTS_ENABLED:+$TESTS_ENABLED,}pdp"
          fi
          if [ "${{ parameters.pdpFuzzy }}" = "True" ]; then
            TESTS_ENABLED="${TESTS_ENABLED:+$TESTS_ENABLED,}pdp-fuzzy"
          fi
          if [ "${{ parameters.quickbuyCombinations }}" = "True" ]; then
            TESTS_ENABLED="${TESTS_ENABLED:+$TESTS_ENABLED,}quickbuy-combinations"
          fi
          if [ "${{ parameters.quickbuyPersonalization }}" = "True" ]; then
            TESTS_ENABLED="${TESTS_ENABLED:+$TESTS_ENABLED,}quickbuy-personalization"
          fi
          if [ "${{ parameters.quickbuyCartValidation }}" = "True" ]; then
            TESTS_ENABLED="${TESTS_ENABLED:+$TESTS_ENABLED,}quickbuy-cart-validation"
          fi
          export TESTS_ENABLED
          echo "TESTS_ENABLED=$TESTS_ENABLED"
          node scripts/run-e2e-ci.mjs
        displayName: Run AI E2E (tests from env TESTS_ENABLED)
        env:
          OPENROUTER_API_KEY: $(OPENROUTER_API_KEY)
          OPENROUTER_AI_MODEL: ${{ parameters.openrouterAiModel }}
          RUN_CHROMIUM: ${{ parameters.runChromium }}
          RUN_FIREFOX: ${{ parameters.runFirefox }}
          RUN_WEBKIT: ${{ parameters.runWebkit }}
          RUN_DESKTOP: ${{ parameters.runDesktop }}
          RUN_TABLET: ${{ parameters.runTablet }}
          RUN_MOBILE: ${{ parameters.runMobile }}
          MAX_PARALLEL_SESSIONS: ${{ parameters.maxParallelSessions }}

      # 1. Sync storico raw: scarica le run precedenti da blob, merge con la run corrente e ricarica
      - script: node scripts/sync-history.mjs
        displayName: Sync raw reports history to blob storage
        env:
          AZURE_STORAGE_CONNECTION_STRING: $(AZURE_STORAGE_CONNECTION_STRING)
          AZURE_STORAGE_CONTAINER: $(AZURE_STORAGE_CONTAINER)
          REPORT_BLOB_PREFIX: e2e

      # 2. Render: rigenera l'HTML (incl. index.html) con lo STORICO completo delle run
      - script: node scripts/render-reports.mjs
        displayName: Convert reports to HTML
        env:
          CLIENT_NAME: $(CLIENT_NAME)

      # 3. Upload HTML su path fisso: lo storico si accumula sempre nello stesso path
      - script: node scripts/upload-reports.mjs
        displayName: Upload HTML reports to blob storage
        env:
          AZURE_STORAGE_CONNECTION_STRING: $(AZURE_STORAGE_CONNECTION_STRING)
          AZURE_STORAGE_CONTAINER: $(AZURE_STORAGE_CONTAINER)
          REPORT_BLOB_PREFIX: e2e

      - task: PublishPipelineArtifact@1
        displayName: Publish reports artifact
        inputs:
          targetPath: reports
          artifact: e2e-reports

      - script: node scripts/email-report.mjs
        displayName: Email report via SendGrid
        env:
          SENDGRID_API_KEY: $(SENDGRID_API_KEY)
          MAIL_FROM: $(MAIL_FROM)
          MAIL_TO: $(MAIL_TO)
          REPORT_HTML_URL: $(REPORT_HTML_URL)
          CLIENT_NAME: $(CLIENT_NAME)


