parameters:
  - name: browsers
    displayName: Browser
    type: string
    default: chromium
    values:
      - chromium
      - firefox
      - webkit
      - chromium,firefox
      - chromium,webkit
      - firefox,webkit
      - chromium,firefox,webkit

trigger:
  branches:
    include:
      - main
      - pipeline-test 

pr: none

schedules:
  - cron: '0 6 * * *'
    displayName: Daily E2E 06:00 UTC
    branches:
      include:
        - main
    always: true

pool:
  name: 'Internal Linux with Docker' 
  demands:
    - jdk -equals 21

variables:
  - group: acmilan-e2e-secrets

jobs:
  - job: e2e
    displayName: AI E2E tests
    timeoutInMinutes: 20
    steps:
      - checkout: self

      - task: NodeTool@0
        displayName: Use Node 22
        inputs:
          versionSpec: '22.x'

      - script: |
          npm install
          npx playwright install --with-deps chromium firefox webkit
        displayName: Install dependencies and browsers

      - script: node scripts/run-e2e-ci.mjs
        displayName: Run AI E2E (launcher-ci.yaml)
        env:
          CURSOR_API_KEY: $(CURSOR_API_KEY)
          BROWSERS: ${{ parameters.browsers }}

      - script: node scripts/render-reports.mjs
        displayName: Convert reports to HTML
        condition: always()

      - script: node scripts/upload-reports.mjs
        displayName: Upload reports to blob storage
        condition: always()
        env:
          AZURE_STORAGE_CONNECTION_STRING: $(AZURE_STORAGE_CONNECTION_STRING)
          AZURE_STORAGE_CONTAINER: $(AZURE_STORAGE_CONTAINER)
          REPORT_BLOB_PREFIX: e2e/$(Build.BuildId)

      - task: PublishPipelineArtifact@1
        displayName: Publish reports artifact
        condition: always()
        inputs:
          targetPath: reports
          artifact: e2e-reports

      - script: node scripts/email-report.mjs
        displayName: Email report via SendGrid
        condition: always()
        env:
          SENDGRID_API_KEY: $(SENDGRID_API_KEY)
          MAIL_FROM: $(MAIL_FROM)
          MAIL_TO: $(MAIL_TO)
          REPORT_HTML_URL: $(REPORT_HTML_URL)


      - task: JakubRumpca.azure-pipelines-html-report.PublishHtmlReport.PublishHtmlReport@1
        displayName: Show HTML report
        condition: always()
        inputs:
          reportDir: reports/index.html
          tabName: E2E Report