# Config della run (test, browser, viewport, modello AI, parallelismo, note)
# NON passa da parametri/env E2E_*: vive in configs/*.config.json per-flusso
# (vedi configs/README.md).
#
# Selezione config nello step "Run AI E2E":
# - PullRequest -> npm run ci:run-e2e-pr (configs/pr.config.json)
# - build variable E2E_RUN_CONFIG presente (run triggerata dall'app Next.js,
#   passata a queue-time da /api/azure-pipeline) -> materializzata su file
#   temporaneo e passata a run-e2e.mjs via --config
# - altrimenti (lancio manuale/schedule su main) -> npm run ci:run-e2e
#   (configs/pipeline.config.json)

trigger:
  branches:
    include:
      - main

# Flusso merge request: usa configs/pr.config.json (gestito nello step di run)
pr:
  branches:
    include:
      - main

schedules:
  - cron: '0 6 * * *'
    displayName: Daily E2E 06:00 UTC
    branches:
      include:
        - main
    always: true

pool:
  name: 'Internal Linux with Docker' 
  demands:
    - jdk -equals 21

variables:
  - group: ai-e2e-secrets

jobs:
  - job: e2e
    displayName: AI E2E tests
    timeoutInMinutes: 20
    steps:
      - checkout: self

      - task: NodeTool@0
        displayName: Use Node 22
        inputs:
          versionSpec: '22.x'

      - script: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
        displayName: Install dependencies and browsers

      - script: |
          if [ "$(Build.Reason)" = "PullRequest" ]; then
            npm run ci:run-e2e-pr
          elif [ -n "$E2E_RUN_CONFIG" ]; then
            CONFIG="$(Agent.TempDirectory)/run-config.json"
            echo "$E2E_RUN_CONFIG" > "$CONFIG"
            echo "Run config inline dall'app Next.js"
            node scripts/run-e2e.mjs --config "$CONFIG"
          else
            npm run ci:run-e2e
          fi
        displayName: Run AI E2E
        continueOnError: true
        env:
          OPENROUTER_API_KEY: $(OPENROUTER_API_KEY)
          # Build variable passata a queue-time da /api/azure-pipeline
          E2E_RUN_CONFIG: $(E2E_RUN_CONFIG)

      - script: npm run ci:upload-reports
        displayName: Upload reports to Azure Blob
        condition: succeededOrFailed()
        env:
          AZURE_STORAGE_CONNECTION_STRING: $(AZURE_STORAGE_CONNECTION_STRING)
          AZURE_STORAGE_CONTAINER: $(AZURE_STORAGE_CONTAINER)

      - script: npm run ci:send-email
        displayName: Send Email report via SendGrid
        condition: succeededOrFailed()
        env:
          EMAIL_SENDGRID_API_KEY: $(SENDGRID_API_KEY)
          EMAIL_FROM: $(EMAIL_FROM)
          EMAIL_TO: $(EMAIL_TO)
          EMAIL_REPORT_HTML_URL: $(EMAIL_REPORT_HTML_URL)
          NEXT_PUBLIC_CLIENT_NAME: $(NEXT_PUBLIC_CLIENT_NAME)
