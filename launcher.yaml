# launcher.yaml - Test Launcher Configuration
# Esecutore test E2E per Shopify Jersey Personalizer
#
# Server MCP playwright: https://www.npmjs.com/package/@playwright/mcp
#  https://github.com/hdorgeval/playwright-fluent/blob/master/src/devices/device-names.ts
#  Path browser installati: ~/Library/Caches/ms-playwright/
#
# Campi per ogni test:
# - name: nome del file .md del test (nella cartella tests/)
# - url: URL completo della pagina da testare
# - action: azione da eseguire
#   - run: esegue il test normalmente
#   - skip: salta questo test
#   - only: esegue SOLO questo test, ignorando tutti gli altri

tests:
  - name: fake.test.md
    url: https://store.acmilan.com
    action: only

  - name: pdp-flow.test.md
    url: https://store.acmilan.com/products/acm-home-authentic-jersey
    action: skip

  - name: quickbuy-combinations.md
    url: https://store.acmilan.com/
    action: skip

  - name: quickbuy-personalization.md
    url: https://store.acmilan.com/
    action: skip

  - name: pdp-break-testing.md
    url: https://store.acmilan.com/products/acm-home-authentic-jersey
    action: skip
