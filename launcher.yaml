# launcher.yaml - Test Launcher Configuration
# Esecutore test E2E per Shopify Jersey Personalizer
#
# Server MCP playwright: https://www.npmjs.com/package/@playwright/mcp
#  https://github.com/hdorgeval/playwright-fluent/blob/master/src/devices/device-names.ts
#  Path browser installati: ~/Library/Caches/ms-playwright/
#
# Configurazione viewport/device:
# - viewport: dimensioni del viewport (larghezzaxaltezza)
#   Esempi: "1280x650" (desktop), "390x844" (iPhone 12/13/14/15)
# - device: nome del dispositivo da emulare (opzionale, vedi .roo/mpc.env.md per lista)
#   Se specificato, sovrascrive il viewport. Lasciare vuoto per usare viewport personalizzato.
#
# Campi per ogni test:
# - name: nome del file .md del test (percorso relativo alla cartella tests/)
# - url: URL completo della pagina da testare
# - action: azione da eseguire
#   - run: esegue il test normalmente
#   - skip: salta questo test
#   - only: esegue SOLO questo test, ignorando tutti gli altri
# config:
# - desktop: 1280x650
# - mobile : 390x844

config:
  viewport: '1280x650'
  device: ''

tests:
  - name: fake.test.md
    url: https://store.acmilan.com
    action: skip

  - name: pdp/pdp.test.md
    url: https://tt0iw05uhjjsxc16-61184966894.shopifypreview.com/products/acm-home-authentic-jersey
    action: run

  - name: pdp/pdp.test.md
    url: https://store.acmilan.com/products/acm-home-authentic-jersey
    action: skip

  - name: pdp/pdp-fuzzy.test.md
    url: https://store.acmilan.com/products/acm-home-authentic-jersey
    action: skip

  - name: quickbuy/quickbuy-combinations.test.md
    url: https://store.acmilan.com/
    action: skip

  - name: quickbuy/quickbuy-personalization.test.md
    url: https://store.acmilan.com/
    action: skip

  - name: quickbuy/quickbuy-cart-validation.test.md
    url: https://store.acmilan.com/
    action: skip
